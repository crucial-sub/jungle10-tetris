<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no"
		/>
		<script src="https://cdn.tailwindcss.com"></script>

		<!-- 구글폰트 -->
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Socket.IO 클라이언트 -->
		<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

		<title>정글 테트리스</title>
	</head>
	<style>
		.overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(255,255,255,0.8);
			z-index: 999;
		}

		.loader {
			width: 38vh;
			height: 38vh;
			border: 15px solid #00D67A;
			border-bottom-color: transparent;
			border-radius: 50%;
			display: inline-block;
			box-sizing: border-box;
			animation: rotation 1s linear infinite;
			z-index:1000;
		}
			@keyframes rotation {
			0% {
				transform: rotate(0deg);
			}
			100% {
				transform: rotate(360deg);
			}
		}
	</style>

	<body class="bg-white flex justify-center items-center min-h-screen">
		<main class="flex gap-40">
			<canvas id="game-board" class="bg-black "></canvas>
			<aside>
				<h1 id="room-id" class="text-4xl text-green-500 font-bold text-center">1번 방</h1>
				<div class="flex flex-col justify-start text-green-500 text-3xl gap-10 mt-10">
					<div>{{ user_name }}</div>
					<div id="high-score">최고 점수 : {{ user_high_score }}</div>
					<div id="score">점수 : 0</div>
					<div id="time">남은 시간 : 00초</div>
				</div>
				<div class="flex flex-col justify-start text-blue-500 text-3xl gap-10 mt-[50px]">
					<div id="opponent">상대 이름</div>
					<div id="opponentScore">점수 : 0</div>
				</div>
			</aside>
		</main>
		<div id="loading-screen">
			<div class="overlay"></div>
			<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[1000]">
				 <span id="loader" class="loader"></span>
			</div>
			<div id="countdown" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
					text-black text-[300px] hidden z-[1000] rotate-14">
			</div>
		</div>
		<div id="modal" class="hidden">
			<div
				class="modal-bg fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
			>
				<div
					class="modal-container relative bg-white rounded-lg shadow-lg p-8 w-[600px] h-[400px] flex flex-col items-center justify-center"
				>
					<div id="modal-content"></div>
				</div>
			</div>
		</div>

		<script>
			// ============================================================================
			// Socket.IO 연결 및 초기화
			// ============================================================================
			const socket = io('{{ socket_url }}', {
				withCredentials: true
			});
			const room_id = sessionStorage.getItem('room_id');
			const roomId = document.getElementById('room-id')
			roomId.textContent = room_id

			let userId = ''
			let hasGameEnded = false;

			socket.on('connect', function() {
				console.log('멀티페이지 소켓 연결');
			});
			socket.on('connect_success', function(data) {
				userId = data.user_id
				sessionStorage.setItem('user_Id', userId)
			})
			socket.on('game:start', function(data) {
				const { players } = data
				const opponent = players.filter((player)=> player.user_id !== userId)[0];
				const opponentName = document.getElementById('opponent');
				opponentName.textContent = opponent.name;

				// Initialize P2P connection (first player in list is initiator)
				const isInitiator = players[0].user_id === userId;
				initP2P(isInitiator);

				gameStartCountdown();
			})
			socket.emit('room:join',{ room_id });

			// ============================================================================
			// 게임 상수
			// ============================================================================
			const COLS = 10;
			const ROWS = 15;
			const BLOCK_SIZE = window.innerHeight * 0.06;
			const GAME_TIME = 60;

			// 고정 타임스텝 상수
			const FIXED_DELTA = 1000 / 60;  // 60 updates per second (16.67ms)
			const DROP_INTERVAL = 1000;      // 1초마다 블록 자동 하강
			const MAX_FRAME_SKIP = 5;        // 최대 프레임 스킵 (무한 루프 방지)

			const KEY = Object.freeze({
				LEFT: 37,
				RIGHT: 39,
				DOWN: 40,
				UP: 38,
				SPACE: 32
			});

			const MOVES = {
				[KEY.LEFT]: { dx: -1, dy: 0 },
				[KEY.RIGHT]: { dx: 1, dy: 0 },
				[KEY.DOWN]: { dx: 0, dy: 1 }
			};

			const COLORS = ['cyan', 'blue', 'orange', 'yellow', 'green', 'purple', 'red'];

			const BLOCK_SHAPES = [
				{ blocks: [[-1, 0], [0, 0], [1, 0], [2, 0]], center: [0, 0] },
				{ blocks: [[-1, 0], [0, 0], [1, 0], [1, -1]], center: [0, 0] },
				{ blocks: [[-1, 0], [0, 0], [1, 0], [1, 1]], center: [0, 0] },
				{ blocks: [[0, 0], [1, 0], [0, 1], [1, 1]], center: null },
				{ blocks: [[-1, 0], [0, 0], [0, 1], [1, 1]], center: [0, 0] },
				{ blocks: [[-1, 0], [0, 0], [1, 0], [0, 1]], center: [0, 0] },
				{ blocks: [[-1, 1], [0, 1], [0, 0], [1, 0]], center: [0, 0] }
			];

			// ============================================================================
			// Seeded PRNG (Mulberry32 algorithm) - 결정론적 블록 생성용
			// ============================================================================
			class SeededRandom {
				constructor(seed) {
					this.state = seed;
				}
				next() {
					let t = this.state += 0x6D2B79F5;
					t = Math.imul(t ^ t >>> 15, t | 1);
					t ^= t + Math.imul(t ^ t >>> 7, t | 61);
					return ((t ^ t >>> 14) >>> 0) / 4294967296;
				}
				nextInt(max) {
					return Math.floor(this.next() * max);
				}
			}

			// ============================================================================
			// 게임 상태
			// ============================================================================
			const game = {
				canvas: document.getElementById('game-board'),
				ctx: null,
				grid: [],
				current: null,
				over: false
			};

			// 고정 타임스텝용 변수
			let accumulator = 0;
			let lastTime = 0;
			let dropCounter = 0;

			// 보간용 이전 상태
			let previousBlockY = 0;

			// 게임 시간 관련
			let gameTimeRemaining = GAME_TIME;
			let lastSecond = 0;

			// 점수
			let score = 0;
			let opponentScore = 0;

			// Seeded RNG
			let gameSeed = null;
			let rng = null;

			// 리플레이용 입력 로그
			const inputLog = { seed: null, startTime: null, inputs: [] };
			let frameCount = 0;

			// ============================================================================
			// 유틸리티 함수
			// ============================================================================

			// 선형 보간 함수
			function lerp(start, end, alpha) {
				return start + (end - start) * alpha;
			}

			function logInput(action) {
				inputLog.inputs.push({
					frame: frameCount,
					action: action,
					timestamp: performance.now() - inputLog.startTime
				});
			}

			// ============================================================================
			// 클라이언트 예측 (Client-Side Prediction)
			// ============================================================================
			let inputSequence = 0;
			const pendingInputs = [];
			let serverEngineReady = false;

			function sendInput(action) {
				inputSequence++;
				const input = { seq: inputSequence, action: action, timestamp: Date.now() };
				pendingInputs.push(input);

				// Send to server for validation (if engine is ready)
				if (serverEngineReady) {
					socket.emit('game:input', { room_id: room_id, input: input });
				}
			}

			// Generate local state hash for reconciliation
			function generateLocalStateHash() {
				const state = {
					grid: game.grid,
					score: score,
					current: game.current ? {
						x: game.current.x,
						y: game.current.y,
						blocks: game.current.blocks,
						color_index: COLORS.indexOf(game.current.color)
					} : null,
					game_over: game.over
				};
				const stateStr = JSON.stringify(state);
				let hash = 0;
				for (let i = 0; i < stateStr.length; i++) {
					const chr = stateStr.charCodeAt(i);
					hash = ((hash << 5) - hash) + chr;
					hash |= 0;
				}
				return hash.toString(16);
			}

			// Handle server acknowledgment
			socket.on('game:input_ack', function(data) {
				const ackSeq = data.seq;
				const idx = pendingInputs.findIndex(i => i.seq === ackSeq);
				if (idx !== -1) {
					pendingInputs.splice(0, idx + 1);
				}

				if (data.state_hash && data.valid === false) {
					console.warn('Server rejected input:', data);
					socket.emit('game:request_state', { room_id: room_id });
				}
			});

			// Handle full state for reconciliation
			socket.on('game:full_state', function(data) {
				if (data.error) {
					console.error('Failed to get server state:', data.error);
					return;
				}

				console.log('Reconciling with server state');
				game.grid = data.grid;
				score = data.score;
				game.over = data.game_over;

				if (data.current_block) {
					game.current = {
						x: data.current_block.x,
						y: data.current_block.y,
						color: COLORS[data.current_block.color_index],
						blocks: data.current_block.blocks,
						center: data.current_block.center
					};
					previousBlockY = game.current.y;
				}

				pendingInputs.forEach(input => {
					executeInputLocally(input.action);
				});

				updateScoreDisplay(score);
			});

			socket.on('game:engine_ready', function(data) {
				serverEngineReady = true;
				console.log('Server engine ready, initial hash:', data.state_hash);
			});

			function executeInputLocally(action) {
				switch (action) {
					case 'left': moveBlock(-1, 0); break;
					case 'right': moveBlock(1, 0); break;
					case 'down': moveBlock(0, 1); break;
					case 'rotate': rotate(); break;
					case 'hardDrop': hardDrop(); break;
				}
			}

			// ============================================================================
			// WebRTC P2P Connection
			// ============================================================================
			class P2PConnection {
				constructor(roomId, socket, isInitiator) {
					this.roomId = roomId;
					this.socket = socket;
					this.isInitiator = isInitiator;
					this.peerConnection = null;
					this.dataChannel = null;
					this.connected = false;
					this.onMessageCallback = null;

					this.iceServers = {
						iceServers: [
							{ urls: 'stun:stun.l.google.com:19302' },
							{ urls: 'stun:stun1.l.google.com:19302' }
						]
					};

					this.setupSocketListeners();
				}

				setupSocketListeners() {
					this.socket.on('webrtc:offer', async (data) => {
						if (!this.isInitiator) {
							await this.handleOffer(data.offer);
						}
					});

					this.socket.on('webrtc:answer', async (data) => {
						if (this.isInitiator) {
							await this.handleAnswer(data.answer);
						}
					});

					this.socket.on('webrtc:ice_candidate', async (data) => {
						await this.handleIceCandidate(data.candidate);
					});
				}

				async init() {
					try {
						this.peerConnection = new RTCPeerConnection(this.iceServers);

						this.peerConnection.onicecandidate = (event) => {
							if (event.candidate) {
								this.socket.emit('webrtc:ice_candidate', {
									room_id: this.roomId,
									candidate: event.candidate
								});
							}
						};

						this.peerConnection.onconnectionstatechange = () => {
							console.log('P2P connection state:', this.peerConnection.connectionState);
							if (this.peerConnection.connectionState === 'connected') {
								this.connected = true;
								console.log('P2P connection established!');
							} else if (this.peerConnection.connectionState === 'failed' ||
									   this.peerConnection.connectionState === 'disconnected') {
								this.connected = false;
								console.log('P2P connection lost, falling back to Socket.IO');
							}
						};

						if (this.isInitiator) {
							await this.createOffer();
						}

						return true;
					} catch (error) {
						console.error('P2P init error:', error);
						return false;
					}
				}

				async createOffer() {
					this.dataChannel = this.peerConnection.createDataChannel('gameData', {
						ordered: false,
						maxRetransmits: 0
					});

					this.setupDataChannel(this.dataChannel);

					const offer = await this.peerConnection.createOffer();
					await this.peerConnection.setLocalDescription(offer);

					this.socket.emit('webrtc:offer', {
						room_id: this.roomId,
						offer: offer
					});
				}

				async handleOffer(offer) {
					await this.peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

					this.peerConnection.ondatachannel = (event) => {
						this.dataChannel = event.channel;
						this.setupDataChannel(this.dataChannel);
					};

					const answer = await this.peerConnection.createAnswer();
					await this.peerConnection.setLocalDescription(answer);

					this.socket.emit('webrtc:answer', {
						room_id: this.roomId,
						answer: answer
					});
				}

				async handleAnswer(answer) {
					await this.peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
				}

				async handleIceCandidate(candidate) {
					if (candidate && this.peerConnection) {
						try {
							await this.peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
						} catch (error) {
							console.error('Error adding ICE candidate:', error);
						}
					}
				}

				setupDataChannel(channel) {
					channel.onopen = () => {
						console.log('Data channel opened');
						this.connected = true;
					};

					channel.onclose = () => {
						console.log('Data channel closed');
						this.connected = false;
					};

					channel.onmessage = (event) => {
						try {
							const data = JSON.parse(event.data);
							if (this.onMessageCallback) {
								this.onMessageCallback(data);
							}
						} catch (error) {
							console.error('Error parsing P2P message:', error);
						}
					};
				}

				send(data) {
					if (this.connected && this.dataChannel && this.dataChannel.readyState === 'open') {
						try {
							this.dataChannel.send(JSON.stringify(data));
							return true;
						} catch (error) {
							console.error('P2P send error:', error);
							return false;
						}
					}
					return false;
				}

				onMessage(callback) {
					this.onMessageCallback = callback;
				}

				close() {
					if (this.dataChannel) {
						this.dataChannel.close();
					}
					if (this.peerConnection) {
						this.peerConnection.close();
					}
					this.connected = false;
				}
			}

			let p2pConnection = null;

			function initP2P(isInitiator) {
				p2pConnection = new P2PConnection(room_id, socket, isInitiator);
				p2pConnection.init();

				p2pConnection.onMessage((data) => {
					if (data.type === 'score') {
						if (data.user_id !== userId) {
							opponentScore = data.score;
							document.getElementById('opponentScore').textContent = `점수: ${opponentScore}`;
						}
					}
				});
			}

			function sendScoreUpdate(totalScore) {
				const scoreData = { type: 'score', score: totalScore, user_id: userId };

				if (p2pConnection && p2pConnection.send(scoreData)) {
					socket.emit('game:score_update', {
						room_id: room_id,
						score: totalScore
					});
				} else {
					socket.emit('game:score_update', {
						room_id: room_id,
						score: totalScore
					});
				}
			}

			// Socket.IO fallback listener for score updates
			socket.on('game:score_update', function(data) {
				const { players } = data;
				const opponentData = players.filter((player) => player.user_id !== userId)[0];
				if (opponentData) {
					const totalOpponentScore = opponentData.score;
					if (totalOpponentScore !== opponentScore) {
						opponentScore = totalOpponentScore;
						document.getElementById('opponentScore').textContent = `점수: ${opponentScore}`;
					}
				}
			});

			// ============================================================================
			// 캔버스 초기화
			// ============================================================================
			function initializeCanvas() {
				game.canvas.width = COLS * BLOCK_SIZE;
				game.canvas.height = ROWS * BLOCK_SIZE;
				game.ctx = game.canvas.getContext('2d');
				game.ctx.scale(BLOCK_SIZE, BLOCK_SIZE);
			}

			function initializeBoard() {
				return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
			}

			// ============================================================================
			// UI 업데이트
			// ============================================================================
			function updateTimeDisplay() {
				document.getElementById('time').textContent = `남은 시간: ${gameTimeRemaining}초`;
			}

			function updateScoreDisplay(totalScore = 0) {
				document.getElementById('score').textContent = `점수: ${totalScore}`;
				sendScoreUpdate(totalScore);
			}

			// ============================================================================
			// 게임 시작 카운트다운
			// ============================================================================
			function gameStartCountdown() {
				const loader = document.querySelector('#loader')
				loader.remove()

				const countdownEl = document.getElementById('countdown');
				const loadingScreen = document.getElementById('loading-screen');
				let count = 5;
				countdownEl.classList.remove('hidden');
				countdownEl.textContent = count;

				const countdownInterval = setInterval(() => {
					count--;
					if (count > 0) {
						countdownEl.textContent = count;
					} else if (count === 0) {
						countdownEl.textContent = 'GO!';
					} else {
						clearInterval(countdownInterval);
						loadingScreen.remove();
						startGame();
					}
				}, 1000);
			}

			// ============================================================================
			// 게임 시작
			// ============================================================================
			function startGame() {
				// 시드 기반 랜덤 초기화
				gameSeed = Date.now();
				rng = new SeededRandom(gameSeed);

				// 리플레이용 입력 로그 초기화
				inputLog.seed = gameSeed;
				inputLog.startTime = performance.now();
				inputLog.inputs = [];
				frameCount = 0;

				// 클라이언트 예측 상태 초기화
				inputSequence = 0;
				pendingInputs.length = 0;
				serverEngineReady = false;

				// 서버 측 게임 엔진 초기화 요청
				socket.emit('game:init_engine', { room_id: room_id, game_seed: gameSeed });

				// 게임 상태 초기화
				game.grid = initializeBoard();
				game.current = generateBlock();
				game.over = false;
				score = 0;

				// 고정 타임스텝 변수 초기화
				accumulator = 0;
				lastTime = performance.now();
				dropCounter = 0;
				previousBlockY = game.current ? game.current.y : 0;

				// 시간 초기화
				gameTimeRemaining = GAME_TIME;
				lastSecond = Math.floor(lastTime / 1000);

				updateScoreDisplay(0);
				updateTimeDisplay();

				// 게임 루프 시작
				requestAnimationFrame(gameLoop);
			}

			// ============================================================================
			// 게임 루프 (고정 타임스텝 + 보간)
			// ============================================================================
			function gameLoop(now) {
				if (game.over) {
					render(1);
					if (!hasGameEnded) {
						hasGameEnded = true;
						socketGameEnd();
					}
					return;
				}

				const deltaTime = now - lastTime;
				lastTime = now;
				accumulator += deltaTime;

				let updates = 0;

				while (accumulator >= FIXED_DELTA && updates < MAX_FRAME_SKIP) {
					if (game.current) {
						previousBlockY = game.current.y;
					}

					update(FIXED_DELTA);
					accumulator -= FIXED_DELTA;
					updates++;
				}

				if (accumulator > FIXED_DELTA * MAX_FRAME_SKIP) {
					accumulator = 0;
				}

				const alpha = accumulator / FIXED_DELTA;
				render(alpha);

				requestAnimationFrame(gameLoop);
			}

			// ============================================================================
			// 게임 로직 업데이트 (고정 타임스텝)
			// ============================================================================
			function update(delta) {
				frameCount++;

				dropCounter += delta;
				if (dropCounter >= DROP_INTERVAL) {
					moveBlock(0, 1);
					dropCounter -= DROP_INTERVAL;
				}

				const currentSecond = Math.floor(performance.now() / 1000);
				if (currentSecond !== lastSecond) {
					lastSecond = currentSecond;
					gameTimeRemaining--;
					updateTimeDisplay();

					if (gameTimeRemaining <= 0) {
						game.over = true;
					}
				}
			}

			// ============================================================================
			// 렌더링 (보간 적용)
			// ============================================================================
			function render(alpha = 1) {
				clear();
				drawGrid();
				drawFixedBlocks();

				if (game.current) {
					drawCurrentBlock(alpha);
				}
			}

			function clear() {
				game.ctx.clearRect(0, 0, COLS, ROWS);
			}

			function drawGrid() {
				const ctx = game.ctx;
				ctx.strokeStyle = '#444';
				ctx.lineWidth = 0.05;
				for (let r = 0; r <= ROWS; r++) {
					ctx.beginPath();
					ctx.moveTo(0, r);
					ctx.lineTo(COLS, r);
					ctx.stroke();
				}
				for (let c = 0; c <= COLS; c++) {
					ctx.beginPath();
					ctx.moveTo(c, 0);
					ctx.lineTo(c, ROWS);
					ctx.stroke();
				}
			}

			function drawFixedBlocks() {
				const ctx = game.ctx;
				for (let y = 0; y < ROWS; y++) {
					for (let x = 0; x < COLS; x++) {
						const cell = game.grid[y][x];
						if (cell !== 0) {
							ctx.fillStyle = COLORS[cell - 1];
							ctx.fillRect(x, y, 1, 1);
						}
					}
				}
			}

			function drawCurrentBlock(alpha) {
				const ctx = game.ctx;
				const block = game.current;

				const interpolatedY = lerp(previousBlockY, block.y, alpha);

				ctx.fillStyle = block.color;
				block.blocks.forEach(([dx, dy]) => {
					ctx.fillRect(block.x + dx, interpolatedY + dy, 1, 1);
				});
			}

			// ============================================================================
			// 블록 생성
			// ============================================================================
			function generateBlock() {
				const index = rng ? rng.nextInt(BLOCK_SHAPES.length) : Math.floor(Math.random() * BLOCK_SHAPES.length);
				const { blocks, center } = BLOCK_SHAPES[index];
				const color = COLORS[index];
				const minDy = Math.min(...blocks.map(([_, dy]) => dy));

				const newBlock = {
					x: 4,
					y: -minDy,
					color,
					blocks: blocks.map(b => [...b]),
					center: center ? [...center] : null
				};

				if (isColliding(game.grid, newBlock, newBlock.x, newBlock.y)) {
					game.over = true;
				}

				previousBlockY = newBlock.y;

				return newBlock;
			}

			// ============================================================================
			// 블록 이동/회전/하드드롭
			// ============================================================================
			function moveBlock(dx, dy) {
				if (game.over || !game.current) return;

				const { current, grid } = game;
				const newX = current.x + dx;
				const newY = current.y + dy;

				if (!isColliding(grid, current, newX, newY)) {
					if (dx !== 0 || dy !== 1 || dropCounter < DROP_INTERVAL) {
						previousBlockY = newY;
					}
					current.x = newX;
					current.y = newY;
				} else if (dy === 1) {
					const lines = placeBlock();
					addScore(lines);
					game.current = generateBlock();
				}
			}

			function move(dx, dy) {
				previousBlockY = game.current ? game.current.y : 0;
				moveBlock(dx, dy);
			}

			function rotate() {
				if (game.over || !game.current) return;

				const { current, grid } = game;
				if (!current.center) return;

				const rotated = current.blocks.map(([x, y]) => {
					const [cx, cy] = current.center;
					const relX = x - cx;
					const relY = y - cy;
					return [-relY + cx, relX + cy];
				});

				if (!isColliding(grid, current, current.x, current.y, rotated, true)) {
					current.blocks = rotated;
				}
			}

			function hardDrop() {
				if (game.over || !game.current) return;

				const block = game.current;
				while (!isColliding(game.grid, block, block.x, block.y + 1)) {
					block.y++;
				}
				previousBlockY = block.y;
				const lines = placeBlock();
				addScore(lines, true);
				game.current = generateBlock();
			}

			// ============================================================================
			// 블록 배치 및 라인 클리어
			// ============================================================================
			function placeBlock() {
				const { grid, current } = game;
				const colorIndex = COLORS.indexOf(current.color) + 1;

				current.blocks.forEach(([dx, dy]) => {
					const x = current.x + dx;
					const y = current.y + dy;
					if (y >= 0) grid[y][x] = colorIndex;
				});

				return clearLines();
			}

			function isColliding(grid, block, offsetX, offsetY, override = null, strict = false) {
				const cells = override || block.blocks;
				return cells.some(([dx, dy]) => {
					const x = offsetX + dx;
					const y = offsetY + dy;
					if (x < 0 || x >= COLS || y >= ROWS || (strict && y < 0)) return true;
					return y >= 0 && grid[y][x] !== 0;
				});
			}

			function clearLines() {
				let cleared = 0;
				for (let y = ROWS - 1; y >= 0; y--) {
					if (game.grid[y].every(cell => cell !== 0)) {
						game.grid.splice(y, 1);
						game.grid.unshift(Array(COLS).fill(0));
						y++;
						cleared++;
					}
				}
				return cleared;
			}

			// ============================================================================
			// 점수 계산
			// ============================================================================
			function addScore(lines, isHardDrop = false) {
				const base = lines === 1 ? 100 : lines === 2 ? 300 : lines === 3 ? 500 : lines >= 4 ? 800 : 0;
				const gained = isHardDrop ? base * 2 : base;
				score += gained;
				if (gained) updateScoreDisplay(score);
			}

			// ============================================================================
			// 키보드 입력 처리
			// ============================================================================
			function onKeyDown(e) {
				const moveAction = MOVES[e.keyCode];
				if (moveAction) {
					e.preventDefault();
					const action = e.keyCode === KEY.LEFT ? 'left' : e.keyCode === KEY.RIGHT ? 'right' : 'down';
					logInput(action);
					sendInput(action);
					move(moveAction.dx, moveAction.dy);
				} else if (e.keyCode === KEY.UP) {
					e.preventDefault();
					logInput('rotate');
					sendInput('rotate');
					rotate();
				} else if (e.keyCode === KEY.SPACE) {
					e.preventDefault();
					logInput('hardDrop');
					sendInput('hardDrop');
					hardDrop();
				}
			}

			// ============================================================================
			// 게임 종료 처리
			// ============================================================================
			function socketGameEnd() {
				socket.on('game:end', function(data) {
					const {status} = data
					if(status === 'waiting') {
						openModal(score, status, {})
					} else if(status === 'finished') {
						openModal(score, status, data)
					}
				})
				socket.emit('game:end', {
					room_id: room_id,
					score: score,
					input_log: inputLog.inputs,
					game_seed: inputLog.seed
				})
			}

			socket.on('room:leave', function(data) {
				console.log('방 나가기 이벤트 수신:', data);
			})

			function openModal(score, status, data = {}) {
				const modal = document.getElementById("modal");
				const modalContent = document.getElementById("modal-content");
				modal.classList.remove("hidden");

				if(status === 'waiting') {
					const html = `
						<div class="text-green-500 text-[32px]" >
							상대방을 기다리는 중..
						</div>
					`
					modalContent.innerHTML = html;
				} else if(status === 'finished') {
					const result = data.is_draw ? '무승부' : (data.winner === userId ? '승리' : '패배');
					const html = `
						<div class="flex flex-col justify-center items-center gap-12 text-center">
							<p class="text-[48px] font-bold text-green-500">${result}</p>
							<p class="text-green-500 text-[40px]">점수: ${score}</p>
							<button id="confirm-btn" class="mt-[22px] w-[180px] h-[72px] bg-green-500 text-white text-[40px] font-bold rounded-[20px] hover:bg-green-600 transition text-center items-center">확인</button>
						</div>
					`
					modalContent.innerHTML = html;
					const confirmBtn = document.getElementById('confirm-btn')
					confirmBtn.addEventListener('click',()=>{
						socket.emit('room:leave', {
							room_id: room_id
						})
						socket.on('room:leave', (data) => {
							console.log(data)
						})
						window.location.href = 'main.html'
					})
				}
			}

			// ============================================================================
			// 초기화 및 시작
			// ============================================================================
			initializeCanvas();
			drawGrid();
			document.addEventListener('keydown', onKeyDown);

		</script>
	</body>
</html>
